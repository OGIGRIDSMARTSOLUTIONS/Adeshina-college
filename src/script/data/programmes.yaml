# =============================================================================
# programmes.yaml  =  COURSE / PROGRAMME LIST (the facts)
# =============================================================================
# Each item under "programmes:" is one course the school offers.
#
# Important fields:
#   id                 → unique code used in the app (do not duplicate)
#   name               → what students see (e.g. CHEW, NCE English / History)
#   collegeId          → health-technology  OR  education
#   level              → Diploma, Certificate, NCE, etc.
#   duration           → e.g. 3 Years
#   mode               → study mode list (currently Full-Time only)
#   verificationStatus → verified  OR  research-found
#
# React does NOT read this file directly.
# Run:  npm run sync:programmes -- load programmes.yaml
# That updates src/data/programmes.ts for the website.
#

programmes:
  - id: community-health-chew
    name: Community Health Extension Worker (CHEW)
    collegeId: health-technology
    level: Diploma
    duration: 3 Years
    mode:
      - Full-Time
    verificationStatus: research-found
    description: >-
      Comprehensive clinical and community primary healthcare practice, immunization delivery,
      maternal & child health, and community health management.
    entryRequirements:
      - Five (5) credit passes in SSCE/WAEC/NECO/NABTEB at not more than two sittings.
      - >-
        Mandatory credits in English Language, Mathematics, Biology/Health Science, Chemistry, and
        Physics.
    careerOpportunities:
      - Primary Health Care Centres (PHCs)
      - General & Specialist Hospitals
      - Community Health Outreach Programmes
      - Local Government Health Departments
